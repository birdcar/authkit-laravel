name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.3, 8.4, 8.5]
        laravel: [12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: PHPStan
        if: runner.os != 'Windows'
        run: composer analyse

      # Single-process on Windows: parallel workers each run the larastan
      # bootstrap, racing to rename the shared Testbench skeleton's provider
      # manifest — Windows rename() onto an open destination fails with
      # "Access is denied" where POSIX rename wins atomically.
      - name: PHPStan (Windows)
        if: runner.os == 'Windows'
        run: vendor/bin/phpstan analyse -c phpstan-windows.neon

      - name: Linter
        run: composer lint:check

      # FORK_IO_FACTOR=-1 clamps Pokio's maxProcesses to 1, serializing
      # pest-plugin-type-coverage's forks: parallel forks race on the
      # plugin's shared .temp cache file and intermittently corrupt it into
      # a parse error (observed twice on these runners; unfixed in the 4.x
      # plugin line, and 5.x needs Pest 5). Read via getenv(), so it works
      # regardless of variables_order — the plugin's own $_ENV escape hatch
      # does not.
      - name: Type Coverage
        if: runner.os != 'Windows'
        run: composer test:types
        env:
          FORK_IO_FACTOR: "-1"

      # The emulate-backed suites boot @workos/emulate themselves, per suite,
      # via tests/Support/EmulateServer (npx, per-suite ports and seed files) —
      # no external server or WORKOS_* env is involved. This step warms the
      # npx cache once so those in-suite boots are sub-second instead of each
      # risking a cold-download against the 60s health budget, and validates
      # every seed fixture so a malformed seed fails loudly here rather than
      # as an opaque emulate boot timeout mid-suite. Windows is excluded by
      # design: EmulateServer::isAvailable() skips emulate tests there.
      - name: Prime workos/emulate (warm npx cache, validate seeds)
        if: runner.os != 'Windows'
        run: |
          for seed in tests/Fixtures/workos-emulate*.config.yaml; do
            npx --yes @workos/emulate@0.6.0 --seed "$seed" --validate-config
          done

      - name: Test Suite
        if: runner.os != 'Windows'
        run: composer test:unit

      - name: Test Suite (Windows)
        if: runner.os == 'Windows'
        run: vendor/bin/pest
